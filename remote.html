<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070d1a">
  <title>Control remoto · IDEA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c084fc' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23c084fc'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/remote.css">
</head>
<body class="remote-page">
  <header class="rm-top">
    <div class="rm-brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="none" stroke="var(--mul)" stroke-width="2.6"/><circle cx="16" cy="16" r="3" fill="var(--mul)"/></svg><b>IDEA</b><span>Control remoto</span></div>
    <span class="rm-conn" id="conn" data-s="desconectado">desconectado</span>
  </header>

  <!-- Entrada con código -->
  <main class="rm-join" id="join">
    <h1>Entrar a la sala</h1>
    <p>Escribe el código que aparece en la pantalla del presentador, o escanea su código QR.</p>
    <form id="join-form" autocomplete="off">
      <input id="code" class="rm-code-in mono" inputmode="text" autocapitalize="characters" maxlength="9" placeholder="ABCD EFGH" aria-label="Código de la sala">
      <button class="rm-btn primary" type="submit">Entrar</button>
    </form>
    <p class="rm-error" id="join-error" role="alert"></p>
    <p class="rm-hint" id="mode-hint"></p>
  </main>

  <!-- Control -->
  <main class="rm-main" id="main" hidden>
    <section class="rm-now" aria-live="polite">
      <div class="rm-block" id="block"></div>
      <div class="rm-num mono"><b id="num">–</b><span id="total"></span></div>
      <div class="rm-title" id="title">Esperando a la presentación…</div>
      <div class="rm-progress" id="progress"></div>
    </section>

    <section class="rm-demo" id="demo" hidden>
      <div class="rm-demo-h"><span>Demostración · no cambia de diapositiva</span><b class="mono" id="demo-status"></b></div>
      <div id="demo-actions"></div>
    </section>

    <details class="rm-list" id="list">
      <summary>Ir a una diapositiva</summary>
      <div id="slides"></div>
    </details>

    <section class="rm-nav">
      <div class="rm-ends">
        <button class="rm-btn small" data-c="GO_TO_START">⏮ Primera</button>
        <button class="rm-btn small" data-c="GO_TO_END">Última ⏭</button>
      </div>
      <div class="rm-big">
        <button class="rm-btn big" data-c="PREVIOUS" aria-label="Diapositiva anterior">‹<small>Anterior</small></button>
        <button class="rm-btn big primary" data-c="NEXT" aria-label="Diapositiva siguiente">›<small>Siguiente</small></button>
      </div>
      <button class="rm-leave" id="leave">Desconectarse</button>
    </section>
  </main>

  <!-- Sesión terminada -->
  <main class="rm-join" id="ended" hidden>
    <h1>Sesión terminada</h1>
    <p>El presentador cerró la sala o te desconectaste.</p>
    <button class="rm-btn primary" id="again">Entrar con otro código</button>
  </main>

  <script src="js/remote-config.js"></script>
  <script src="js/remote/protocol.js"></script>
  <script src="js/remote/securechannel.js"></script>
  <script src="js/remote/transport.js"></script>
  <script src="js/remote/remote-app.js"></script>
</body>
</html>
